# template — customer profile (≤150 lines). Context, not requirements.
# kind: customer = a market segment you serve; see IP_word.word.yaml for the
# internal-stakeholder counterpart (ISO 29148 §5.2.2 makes both first-class).
# Formatting: block style everywhere (one field per line) — flow mappings
# {…} are lint-rejected: commas inside braces silently create stray keys.
uid: "00000"
alias: word.word
version: 1
slug: <slug>
kind: customer
rank: 1                # portfolio order across ALL profiles, incl. internal
status: icp            # icp | secondary | parked   (customer profiles only)
persona:
  role: <role>
  proficiency: <level>
context:
  environment: <where>
  scale:
    users_min: 0
    users_max: 0
stakeholders:          # ID'd — BRD rows attribute to these (req mint)
  - uid: "00000"
    alias: word.word
    version: 1
    role: <who owns the outcome>
constraints:           # ID'd context other docs cite; graduates into the BRD
  - uid: "00000"
    alias: word.word
    version: 1
    text: <hard boundary>
