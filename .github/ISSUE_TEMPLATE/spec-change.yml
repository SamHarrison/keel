    id: motivation
    attributes: {label: "Motivating BRD link (or 'internal-consistency: <why>')"}
    validations: {required: true}
  - type: textarea
    id: change
    attributes: {label: Proposed row change (alias@version → new text)}
    validations: {required: true}
