# keel template — customer profile (≤150 lines). Context, not requirements.
# kind: customer = a market segment you serve; see IP-1.yaml for the
# internal-stakeholder counterpart (ISO 29148 §5.2.2 makes both first-class).
# Formatting: stakeholders/constraints use block style (one field per line),
# never condensed flow style — commas inside {…} silently create stray keys.
id: CP-1
slug: <slug>
kind: customer
rank: 1                # portfolio order across ALL profiles, incl. internal
status: icp            # icp | secondary | parked   (customer profiles only)
persona: {role: <role>, proficiency: <level>}
context: {environment: <where>, scale: {users_min: 0, users_max: 0}}
stakeholders:          # ID'd — BRD rows attribute to these (req mint)
  - uid: "00000"
    alias: word.word
    version: 1
    role: <who owns the outcome>
constraints:           # ID'd context other docs cite; graduates into the BRD
  - uid: "00000"
    alias: word.word
    version: 1
    text: <hard boundary>
