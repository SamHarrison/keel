# keel template — PRD section file (≤400 rows). Customer-agnostic. No priority.
# PLACEHOLDER: at inception rename this file for your first real section —
# `core.yaml` (section: core) is the recommended first name — then add one
# file per section as the PRD grows (auth.yaml, upl.yaml, …). The docs/prd/
# directory as a whole is the tailored SyRS+SRS information item.
section: example
requirements:
  - uid: "00000"
    alias: word.word
    version: 1
    type: functional      # functional|interface|quality|constraint|process|definition
    text: <subject> shall <one behavior> <measurable condition/bound>.
    witness: test         # test|demo|analysis|inspection|none
    refs: []
    rationale: <optional>
