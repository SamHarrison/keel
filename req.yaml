# project config (authored) — read by tools/req. See docs/process.md §2.
# The wordlist pins detect an arxivhaiku upgrade that would silently change
# every alias projection (req lint fails until the pins are consciously moved).
alias_separator: "."
wordlists:
  adjectives_sha256: ffec07d411421cb6e47c6311c2d7d77dddbc23c7d8bce2da926bea2d432df992
  nouns_sha256: e3a439f20fe4bff99ebd51e13170b69d017460c6c55d20481726e0a755c06c3c

# Tag vocabulary — the controlled set of functional-area labels a PRD
# requirement or criterion may carry (multi-valued, flat, no hierarchy).
# A row tag not declared here is a lint error; a declared tag no row uses
# is a lint warning. Add a tag by adding a line — a one-line reviewed change.
# Delete this block to opt out of tagging entirely (then any tag is an error).
tags: {}
  # example — replace with your project's areas:
  # auth:   authentication, sessions, account lifecycle, access control
  # upload: submission, publish, and the ingest pipeline
