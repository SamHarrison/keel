# TEMPLATE (copy-and-edit, never edit in place) — business requirements (≤40 rows). Customer priority lives HERE only
# (the PRD's priority_po is the product owner's arbitration, process.md §3).
# Two priorities per row, both 1 = highest:
#   priority_stakeholder — urgency for the NAMED stakeholder (their pain)
#   priority_buying      — rank for the buying unit (who signs; the veto)
# stakeholder_uid/alias/name are all three included so a row reads in place;
# lint verifies uid↔alias projection and that the alias names a real
# stakeholder row in a profile.
meta:
  profile: word.word     # the owning profile's alias
  version: 0.1
requirements:
  - uid: "00000"
    alias: word.word
    version: 1
    statement: <outcome-shaped, implementation-free, bounded>
    stakeholder_uid: "00000"
    stakeholder_alias: word.word
    stakeholder_name: <human-readable role, e.g. Chief Information Officer>
    priority_stakeholder: 1
    priority_buying: 1
    rationale: <why this matters>
    acceptance: <observable signal a demo can show>
    source: elicitation/records/<yyyymmdd>_<hhmmss>_<slug>.md
